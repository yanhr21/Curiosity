<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Active Carrying Diagnostic</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="viewport" aria-label="carrying visualization">
        <canvas id="scene" width="1280" height="720"></canvas>
      </section>

      <aside class="side-panel" aria-label="controls and metrics">
        <div class="panel-block">
          <div class="panel-title">Robot</div>
          <label>
            <span>Height</span>
            <input id="robotHeight" type="range" min="0.82" max="1.22" step="0.01" value="1.00">
          </label>
          <label>
            <span>Arm reach</span>
            <input id="armReach" type="range" min="0.70" max="1.25" step="0.01" value="0.96">
          </label>
          <label>
            <span>Torque cap</span>
            <input id="torqueCap" type="range" min="0.55" max="1.45" step="0.01" value="0.92">
          </label>
        </div>

        <div class="panel-block">
          <div class="panel-title">Box</div>
          <label>
            <span>Mass</span>
            <input id="boxMass" type="range" min="2" max="16" step="0.1" value="8.5">
          </label>
          <label>
            <span>Width</span>
            <input id="boxWidth" type="range" min="0.55" max="1.35" step="0.01" value="0.92">
          </label>
          <label>
            <span>COM offset</span>
            <input id="comOffset" type="range" min="-0.45" max="0.45" step="0.01" value="0.18">
          </label>
          <label>
            <span>Friction</span>
            <input id="friction" type="range" min="0.28" max="0.95" step="0.01" value="0.54">
          </label>
        </div>

        <div class="panel-block controls-row">
          <button id="toggleRun" type="button" aria-label="start or pause">Pause</button>
          <button id="resetRun" type="button" aria-label="reset">Reset</button>
        </div>

        <div class="panel-block metrics" aria-live="polite">
          <div><span>Phase</span><strong id="phaseText">approach</strong></div>
          <div><span>Strategy</span><strong id="strategyText">front carry</strong></div>
          <div><span>Effort</span><strong id="effortText">0.00</strong></div>
          <div><span>Balance</span><strong id="balanceText">0.00</strong></div>
          <div><span>Slip risk</span><strong id="slipText">0.00</strong></div>
        </div>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
